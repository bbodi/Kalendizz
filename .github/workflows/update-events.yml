name: Update events

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests (guards against regressions)
        run: node --test 'tests/**/*.test.mjs'

      - name: Fetch and merge new events
        # --ci: a proxy rate-limit must not fail the run; the job just
        # skips this week and retries on the next schedule.
        run: node scripts/update-events.mjs --ci

      - name: Open a PR if events.js changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          BRANCH="events-update-$(date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add events.js
          git commit -m "events: automated weekly refresh"
          git push origin "$BRANCH"
          gh pr create \
            --title "Events refresh $(date +%F)" \
            --body "Automated weekly update from kizomba-world.com via \`scripts/update-events.mjs\`. Review the diff before merging." \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
